
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子繪本</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
#stage {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  perspective: 1800px;
  background: #000;
}
.surface {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
}
.surface video, .surface img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}
#under { z-index: 1; }
#sheet {
  z-index: 2;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transition: transform 650ms ease-in-out;
}
#sheet.forward {
  transform-origin: left center;
  transform: rotateY(-180deg);
}
#sheet.backward {
  transform-origin: right center;
  transform: rotateY(180deg);
}
.turn {
  position: absolute;
  z-index: 5;
  top: 0;
  bottom: 0;
  width: 20%;
  border: 0;
  padding: 0;
  background: transparent;
}
#prev { left: 0; }
#next { right: 0; }
</style>
</head>
<body>
<main id="stage">
  <div id="under" class="surface"></div>
  <div id="sheet" class="surface"></div>
  <button id="prev" class="turn" aria-label="上一頁"></button>
  <button id="next" class="turn" aria-label="下一頁"></button>
</main>

<script>
const pages = [
  ["video", "cover.mp4.mp4"],
  ["video", "page1.mp4.mp4"],
  ["video", "page2.mp4.mp4"],
  ["video", "page3.mp4.mp4"],
  ["video", "page4.mp4.mp4"],
  ["video", "page5.mp4.mp4"],
  ["video", "page6.mp4.mp4"],
  ["video", "page7.mp4.mp4"],
  ["video", "page8.mp4.mp4"],
  ["video", "page9.mp4.mp4"],
  ["video", "page10.mp4.mp4"],
  ["video", "page11.mp4.mp4"],
  ["video", "page12.mp4.mp4"],
  ["video", "page13.mp4.mp4"],
  ["video", "page14.mp4.mp4"],
  ["video", "page15.mp4.mp4"],
  ["image", "page16.png.png"],
  ["video", "backcover.mp4.mp4"]
];

const sheet = document.getElementById("sheet");
const under = document.getElementById("under");
let index = 0;
let busy = false;
let direction = 1;

function makePage(i) {
  if (i < 0 || i >= pages.length) return document.createElement("div");

  const [type, src] = pages[i];
  const el = document.createElement(type === "image" ? "img" : "video");
  el.src = src;

  if (type === "image") {
    el.alt = "繪本版權頁";
  } else {
    el.muted = true;
    el.defaultMuted = true;
    el.autoplay = false;
    el.loop = false;
    el.controls = false;
    el.playsInline = true;
    el.preload = "auto";
    el.setAttribute("playsinline", "");
    el.addEventListener("error", () => {
      console.error("影片讀取失敗：" + src);
    });
  }
  return el;
}

function show(container, i) {
  container.replaceChildren(makePage(i));
}

function playPage() {
  const video = sheet.querySelector("video");
  if (!video) return;

  video.currentTime = 0;
  const promise = video.play();
  if (promise) promise.catch(() => {});
}

function turn(step) {
  if (busy) return;

  const target = index + step;
  if (target < 0 || target >= pages.length) return;

  busy = true;
  direction = step;

  const currentVideo = sheet.querySelector("video");
  if (currentVideo) currentVideo.pause();

  show(under, target);
  sheet.style.transition = "none";
  sheet.classList.remove("forward", "backward");
  sheet.style.transform = "rotateY(0deg)";
  void sheet.offsetWidth;

  sheet.style.transition = "";
  sheet.classList.add(step > 0 ? "forward" : "backward");
}

sheet.addEventListener("transitionend", event => {
  if (event.propertyName !== "transform" || !busy) return;

  index += direction;
  sheet.style.transition = "none";
  sheet.classList.remove("forward", "backward");
  sheet.style.transform = "rotateY(0deg)";
  void sheet.offsetWidth;

  show(sheet, index);
  show(under, index + 1);
  void sheet.offsetWidth;
  sheet.style.transition = "";

  busy = false;
  playPage();
});

document.getElementById("next").addEventListener("click", () => turn(1));
document.getElementById("prev").addEventListener("click", () => turn(-1));

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight" || event.key === "PageDown") turn(1);
  if (event.key === "ArrowLeft" || event.key === "PageUp") turn(-1);
});

let startX = 0;
let startY = 0;

document.getElementById("stage").addEventListener("touchstart", event => {
  if (event.touches.length !== 1) return;
  startX = event.touches[0].clientX;
  startY = event.touches[0].clientY;
}, { passive: true });

document.getElementById("stage").addEventListener("touchend", event => {
  if (event.changedTouches.length !== 1) return;
  const dx = event.changedTouches[0].clientX - startX;
  const dy = event.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    turn(dx < 0 ? 1 : -1);
  }
}, { passive: true });

show(sheet, index);
show(under, index + 1);
playPage();
</script>
</body>
</html>
