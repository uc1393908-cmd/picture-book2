
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>電子繪本</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#stage {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  perspective: 1800px;
  background: #000;
  touch-action: pan-y;
}

.surface {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #000;
}

.surface video,
.surface img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

#under {
  z-index: 1;
}

#sheet {
  z-index: 2;
  transform: rotateY(0deg);
  transform-style: preserve-3d;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transition: transform 650ms ease-in-out;
  will-change: transform;
}

#sheet.forward {
  transform-origin: left center;
  transform: rotateY(-180deg);
}

#sheet.backward {
  transform-origin: right center;
  transform: rotateY(180deg);
}

.turn {
  position: absolute;
  z-index: 10;
  top: 0;
  bottom: 0;
  width: 22%;
  border: 0;
  margin: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

#prev { left: 0; }
#next { right: 0; }

@media (prefers-reduced-motion: reduce) {
  #sheet { transition-duration: 150ms; }
}
</style>
</head>

<body>
<main id="stage" aria-label="互動電子繪本">
  <div id="under" class="surface"></div>
  <div id="sheet" class="surface"></div>
  <button id="prev" class="turn" type="button" aria-label="上一頁"></button>
  <button id="next" class="turn" type="button" aria-label="下一頁"></button>
</main>

<script>
const pages = [
  ["video", "cover.mp4.mp4"],
  ["video", "page1.mp4.mp4"],
  ["video", "page2.mp4.mp4"],
  ["video", "page3.mp4.mp4"],
  ["video", "page4.mp4.mp4"],
  ["video", "page5.mp4.mp4"],
  ["video", "page6.mp4.mp4"],
  ["video", "page7.mp4.mp4"],
  ["video", "page8.mp4.mp4"],
  ["video", "page9.mp4.mp4"],
  ["video", "page10.mp4.mp4"],
  ["video", "page11.mp4.mp4"],
  ["video", "page12.mp4.mp4"],
  ["video", "page13.mp4.mp4"],
  ["video", "page14.mp4.mp4"],
  ["video", "page15.mp4.mp4"],
  ["image", "page16.png.png"],
  ["video", "backcover.mp4.mp4"]
];

const stage = document.getElementById("stage");
const sheet = document.getElementById("sheet");
const under = document.getElementById("under");

let index = 0;
let busy = false;
let direction = 1;
let finishTimer = null;
let touchStartX = 0;
let touchStartY = 0;

function makePage(i) {
  if (i < 0 || i >= pages.length) {
    const empty = document.createElement("div");
    empty.style.width = "100%";
    empty.style.height = "100%";
    return empty;
  }

  const [type, src] = pages[i];
  const el = document.createElement(type === "image" ? "img" : "video");

  el.src = src;

  if (type === "image") {
    el.alt = "繪本版權頁";
    el.draggable = false;
  } else {
    el.muted = true;
    el.defaultMuted = true;
    el.loop = false;
    el.controls = false;
    el.playsInline = true;
    el.preload = "auto";
    el.setAttribute("playsinline", "");
    el.setAttribute("webkit-playsinline", "");
    el.addEventListener("error", () => {
      console.error("媒體載入失敗：", src);
    });
  }

  return el;
}

function show(container, i) {
  container.replaceChildren(makePage(i));
}

function playPage() {
  const video = sheet.querySelector("video");
  if (!video) return;

  video.currentTime = 0;
  const result = video.play();

  if (result && typeof result.catch === "function") {
    result.catch(() => {
      // 如果瀏覽器限制自動播放，仍可正常翻頁。
    });
  }
}

function finishTurn() {
  if (!busy) return;

  if (finishTimer !== null) {
    clearTimeout(finishTimer);
    finishTimer = null;
  }

  index += direction;

  sheet.style.transition = "none";
  sheet.classList.remove("forward", "backward");
  sheet.style.transform = "rotateY(0deg)";
  void sheet.offsetWidth;

  show(sheet, index);
  show(under, index + 1);

  void sheet.offsetWidth;
  sheet.style.transition = "";

  busy = false;
  playPage();
}

function turn(step) {
  if (busy) return;

  const target = index + step;
  if (target < 0 || target >= pages.length) return;

  busy = true;
  direction = step;

  const currentVideo = sheet.querySelector("video");
  if (currentVideo) currentVideo.pause();

  show(under, target);

  sheet.style.transition = "none";
  sheet.classList.remove("forward", "backward");
  sheet.style.transform = "rotateY(0deg)";
  void sheet.offsetWidth;

  sheet.style.transition = "";
  sheet.classList.add(step > 0 ? "forward" : "backward");

  // 備援：即使瀏覽器沒有觸發 transitionend，也能完成翻頁。
  finishTimer = setTimeout(finishTurn, 800);
}

sheet.addEventListener("transitionend", event => {
  if (event.target === sheet && event.propertyName === "transform") {
    finishTurn();
  }
});

document.getElementById("next").addEventListener("click", event => {
  event.stopPropagation();
  turn(1);
});

document.getElementById("prev").addEventListener("click", event => {
  event.stopPropagation();
  turn(-1);
});

// 點畫面右側或左側也能翻頁，作為按鈕以外的備援。
stage.addEventListener("click", event => {
  if (event.target.closest("button")) return;

  const x = event.clientX;
  const width = stage.clientWidth;

  if (x >= width * 0.78) {
    turn(1);
  } else if (x <= width * 0.22) {
    turn(-1);
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight" || event.key === "PageDown") {
    event.preventDefault();
    turn(1);
  }

  if (event.key === "ArrowLeft" || event.key === "PageUp") {
    event.preventDefault();
    turn(-1);
  }
});

stage.addEventListener("touchstart", event => {
  if (event.touches.length !== 1) return;

  touchStartX = event.touches[0].clientX;
  touchStartY = event.touches[0].clientY;
}, { passive: true });

stage.addEventListener("touchend", event => {
  if (event.changedTouches.length !== 1) return;

  const dx = event.changedTouches[0].clientX - touchStartX;
  const dy = event.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    turn(dx < 0 ? 1 : -1);
  }
}, { passive: true });

show(sheet, index);
show(under, index + 1);
playPage();
</script>
</body>
</html>
