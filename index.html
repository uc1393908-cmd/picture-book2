
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>電子繪本</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  overscroll-behavior: none;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #000;
  perspective: 1500px;
  touch-action: pan-y;
}

#sheet {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #000;
  transform-origin: center;
  will-change: transform, opacity;
}

#sheet video,
#sheet img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  border: 0;
}

#sheet.enter-next {
  animation: enterNext 100ms ease-out both;
}

#sheet.enter-prev {
  animation: enterPrev 100ms ease-out both;
}

@keyframes enterNext {
  from {
    opacity: .85;
    transform: perspective(1500px)
      rotateY(-5deg) translateX(1.5%);
  }
  to {
    opacity: 1;
    transform: perspective(1500px)
      rotateY(0deg) translateX(0);
  }
}

@keyframes enterPrev {
  from {
    opacity: .85;
    transform: perspective(1500px)
      rotateY(5deg) translateX(-1.5%);
  }
  to {
    opacity: 1;
    transform: perspective(1500px)
      rotateY(0deg) translateX(0);
  }
}

#prev, #next {
  position: absolute;
  z-index: 5;
  top: 0;
  bottom: 0;
  width: 22%;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#prev {
  left: 0;
}

#next {
  right: 0;
}

@media (prefers-reduced-motion: reduce) {
  #sheet.enter-next,
  #sheet.enter-prev {
    animation-duration: 50ms;
  }
}
</style>
</head>

<body>
<main id="stage" aria-label="互動電子繪本">
  <div id="sheet"></div>
  <button id="prev" type="button" aria-label="上一頁"></button>
  <button id="next" type="button" aria-label="下一頁"></button>
</main>

<script>
const pages = [
  ["video", "cover.mp4.mp4"],
  ["video", "page1.mp4.mp4"],
  ["video", "page2.mp4.mp4"],
  ["video", "page3.mp4.mp4"],
  ["video", "page4.mp4.mp4"],
  ["video", "page5.mp4.mp4"],
  ["video", "page6.mp4.mp4"],
  ["video", "page7.mp4.mp4"],
  ["video", "page8.mp4.mp4"],
  ["video", "page9.mp4.mp4"],
  ["video", "page10.mp4.mp4"],
  ["video", "page11.mp4.mp4"],
  ["video", "page12.mp4.mp4"],
  ["video", "page13.mp4.mp4"],
  ["video", "page14.mp4.mp4"],
  ["video", "page15.mp4.mp4"],
  ["image", "page16.png.png"],
  ["video", "backcover.mp4.mp4"]
];

const stage = document.getElementById("stage");
const sheet = document.getElementById("sheet");

let index = 0;
let touchStartX = 0;
let touchStartY = 0;
let lastSwipeAt = 0;

function renderPage(step = 0) {
  const [type, src] = pages[index];

  const element = document.createElement(
    type === "image" ? "img" : "video"
  );

  // 先把新頁面放進畫面，不等待影片播放完成。
  sheet.classList.remove("enter-next", "enter-prev");
  sheet.replaceChildren(element);

  void sheet.offsetWidth;

  if (step > 0) {
    sheet.classList.add("enter-next");
  } else if (step < 0) {
    sheet.classList.add("enter-prev");
  }

  if (type === "image") {
    element.alt = "繪本版權頁";
    element.draggable = false;
    element.src = src;
    return;
  }

  element.muted = true;
  element.defaultMuted = true;
  element.loop = false;
  element.controls = false;
  element.playsInline = true;
  element.preload = "auto";
  element.setAttribute("playsinline", "");
  element.setAttribute("webkit-playsinline", "");
  element.setAttribute("disablepictureinpicture", "");

  element.addEventListener("error", () => {
    console.error("媒體載入失敗：", src);
  });

  // 新頁面顯示後，立即載入並播放影片。
  element.src = src;
  element.load();

  const playResult = element.play();

  if (playResult && playResult.catch) {
    playResult.catch(() => {});
  }
}

function turn(step) {
  const target = index + step;

  if (target < 0 || target >= pages.length) {
    return;
  }

  // 不等待動畫結束，允許快速連續翻頁。
  index = target;
  renderPage(step);
}

// 點擊左右邊緣翻頁。
document.getElementById("next").addEventListener("click", () => {
  turn(1);
});

document.getElementById("prev").addEventListener("click", () => {
  turn(-1);
});

// 鍵盤左右鍵翻頁。
document.addEventListener("keydown", event => {
  if (
    event.key === "ArrowRight" ||
    event.key === "PageDown"
  ) {
    event.preventDefault();
    turn(1);
  } else if (
    event.key === "ArrowLeft" ||
    event.key === "PageUp"
  ) {
    event.preventDefault();
    turn(-1);
  }
});

// 手指左右滑動翻頁。
stage.addEventListener("touchstart", event => {
  if (event.touches.length !== 1) return;

  touchStartX = event.touches[0].clientX;
  touchStartY = event.touches[0].clientY;
}, { passive: true });

stage.addEventListener("touchend", event => {
  if (event.changedTouches.length !== 1) return;

  const dx = event.changedTouches[0].clientX - touchStartX;
  const dy = event.changedTouches[0].clientY - touchStartY;

  if (
    Math.abs(dx) > 50 &&
    Math.abs(dx) > Math.abs(dy) * 1.2
  ) {
    lastSwipeAt = Date.now();
    turn(dx < 0 ? 1 : -1);
  }
}, { passive: true });

// 避免滑動後額外的點擊造成連翻兩頁。
stage.addEventListener("click", event => {
  if (Date.now() - lastSwipeAt < 500) {
    event.stopPropagation();
  }
}, true);

// 開啟繪本時顯示封面。
renderPage();
</script>
</body>
</html>
